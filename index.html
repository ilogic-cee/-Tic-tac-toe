                <td id="02" onclick="clickedCell(this)"><div></div></td>
            </tr>
            <tr>
                <td id="10" onclick="clickedCell(this)"><div></div></td>
                <td id="11" onclick="clickedCell(this)"><div></div></td>
                <td id="12" onclick="clickedCell(this)"><div></div></td>
            </tr>
            <tr>
                <td id="20" onclick="clickedCell(this)"><div></div></td>
                <td id="21" onclick="clickedCell(this)"><div></div></td>
                <td id="22" onclick="clickedCell(this)"><div></div></td>
            </tr>
        </table>
        <button id="bnt-restart" onclick="restartBnt(this)">Start AI</button>
    </main>
    <footer>
        <p>Read more on: <a href="#">IlogicJr Newsfeed</a></p>
